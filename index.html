        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

                📱
            </div>
            <h2 class="text-xl font-bold mb-2">Apartment Guide</h2>
            <p class="text-slate-400 text-sm mb-6">Tap the button below to open the guide in fullscreen.</p>
            <button onclick="enterFullscreen()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-6 rounded-xl transition-all shadow-lg shadow-emerald-600/30">

    <!-- Header and tab navigation -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
                <img src="assets/logo.png" alt="Guide icon" class="w-8 h-8"><h1 class="font-bold text-sm text-emerald-400 tracking-wide"> Apartment Guide</h1>
            </div>
            
            <!-- <button onclick="toggleFullscreen()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 transition">
                ⛶ Fullscreen
            </button> -->
        </div>

        <!-- Navigation tabs -->
        <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="switchTab('tab-one')" id="btn-tab-one" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-emerald-600 text-white shadow-md shadow-emerald-600/20">
                Welcome
            </button>
            <button onclick="switchTab('tab-two')" id="btn-tab-two" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                Check-in & Access
            </button>
            <button onclick="switchTab('tab-three')" id="btn-tab-three" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                House Rules
            </button>
            <button onclick="switchTab('tab-four')" id="btn-tab-four" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                My Room
            </button>
            <button onclick="switchTab('tab-five')" id="btn-tab-five" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                Safety and Emergency
            </button>
            <button onclick="switchTab('tab-six')" id="btn-tab-six" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                Check-out
            </button>
            <button onclick="switchTab('tab-seven')" id="btn-tab-seven" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700">
                Explore Ha Noi
            </button>
        </div>
    </header>

    <!-- Tab content -->
    <main class="flex-1 min-h-0 max-w-md w-full mx-auto p-4 flex flex-col">
        <!-- TAB 1: Welcome -->
        <div id="tab-one" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/Welcome.jpg" alt="Welcome" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>

        <!-- TAB 2: Check-in & Access -->
        <div id="tab-two" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/CheckIn.jpg" alt="Check in" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>

        <!-- TAB 3: House Rules -->
        <div id="tab-three" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/HouseRules.jpg" alt="House Rules" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 4: My Room -->
        <div id="tab-four" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/MyRoom.jpg" alt="My Room" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 5: Safety and Emergency -->
        <div id="tab-five" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/SafetyEmergency.jpg" alt="Safety and Emergency" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 6: Check-out -->
        <div id="tab-six" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/CheckOut.jpg" alt="Check out" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 7: Explore -->
        <div id="tab-seven" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/Welcome.jpg" alt="Explore" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-[11px] text-slate-600">
        Rest easy. Roam Ha Noi.
    </footer>

    <!-- Tab navigation script -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-md', 'shadow-emerald-600/20');
                btn.classList.add('bg-slate-800', 'text-slate-400');
            });
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
            activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-md', 'shadow-emerald-600/20');
        }

        function enterFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
            
            const overlay = document.getElementById('welcome-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            window.scrollTo(0, 1);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
