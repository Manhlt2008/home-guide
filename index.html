<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apartment Guide</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (hover: hover) {
            .tab-btn:not(.tab-active):hover { background-color: #334155; }
        }
        [hidden] { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Header and tab navigation -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3 mb-2">
            <div class="flex items-center gap-2">
                <img src="assets/logo.png" alt="Guide icon" class="w-8 h-8"><h1 id="guide-title" class="font-bold text-sm text-emerald-400 tracking-wide"> Apartment Guide</h1>
            </div>
            
            <div class="flex shrink-0 items-center rounded-lg bg-slate-800" role="group" aria-label="Language / Ngôn ngữ">
                <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true" onclick="setLanguage('en')" class="language-btn rounded-lg px-2.5 py-1.5 text-xs font-semibold transition-colors bg-emerald-600 text-white">EN</button>
                <button type="button" data-language="vi" lang="vi" aria-label="Tiếng Việt" aria-pressed="false" onclick="setLanguage('vi')" class="language-btn rounded-lg px-2.5 py-1.5 text-xs font-semibold transition-colors text-slate-400">VN</button>
            </div>
        </div>

        <!-- Navigation tabs -->
        <div class="max-w-md mx-auto flex flex-wrap gap-2 pb-1">
            <button onclick="switchTab('tab-one')" id="btn-tab-one" class="tab-btn tab-active px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-emerald-600 text-white shadow-md shadow-emerald-600/20">
                Welcome
            </button>
            <button onclick="switchTab('tab-two')" id="btn-tab-two" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                Check-in & Access
            </button>
            <button onclick="switchTab('tab-three')" id="btn-tab-three" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                House Rules
            </button>
            <button onclick="switchTab('tab-four')" id="btn-tab-four" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                My Room
            </button>
            <button onclick="switchTab('tab-five')" id="btn-tab-five" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                Safety and Emergency
            </button>
            <button onclick="switchTab('tab-six')" id="btn-tab-six" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                Check-out
            </button>
            <button onclick="switchTab('tab-seven')" id="btn-tab-seven" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400">
                Explore Ha Noi
            </button>
        </div>
    </header>

    <!-- Tab content -->
    <main class="flex-1 min-h-0 max-w-md w-full mx-auto p-4 flex flex-col">
        <!-- TAB 1: Welcome -->
        <div id="tab-one" class="tab-content flex-1 min-h-0">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/Welcome.jpg" data-src-en="assets/Welcome.jpg" data-src-vi="assets/Welcome.jpg" alt="Welcome" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>

        <!-- TAB 2: Check-in & Access -->
        <div id="tab-two" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/CheckIn.jpg" data-src-en="assets/CheckIn.jpg" data-src-vi="assets/Welcome.jpg" alt="Check in" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>

        <!-- TAB 3: House Rules -->
        <div id="tab-three" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/HouseRules.jpg" data-src-en="assets/HouseRules.jpg" data-src-vi="assets/Welcome.jpg" alt="House Rules" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 4: My Room -->
        <div id="tab-four" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/MyRoom.jpg" data-src-en="assets/MyRoom.jpg" data-src-vi="assets/Welcome.jpg" alt="My Room" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 5: Safety and Emergency -->
        <div id="tab-five" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/SafetyEmergency.jpg" data-src-en="assets/SafetyEmergency.jpg" data-src-vi="assets/Welcome.jpg" alt="Safety and Emergency" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 6: Check-out -->
        <div id="tab-six" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/CheckOut.jpg" data-src-en="assets/CheckOut.jpg" data-src-vi="assets/Welcome.jpg" alt="Check out" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
        <!-- TAB 7: Explore -->
        <div id="tab-seven" class="tab-content flex-1 min-h-0 hidden">
            <div class="h-full min-h-0 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-2 shadow-lg">
                <img src="assets/Welcome.jpg" data-src-en="assets/Welcome.jpg" data-src-vi="assets/Welcome.jpg" alt="Explore" class="block w-full h-full rounded-xl object-contain">
            </div>
        </div>
    </main>

    <footer id="guide-footer" class="py-3 text-center text-[11px] text-slate-600">
        Rest easy. Roam Ha Noi.
    </footer>

    <!-- Tab navigation script -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-md', 'shadow-emerald-600/20');
                btn.classList.add('bg-slate-800', 'text-slate-400');
            });
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
            activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-md', 'shadow-emerald-600/20');
        }

        const translations = {
            en: {
                title: 'Apartment Guide',
                footer: 'Rest easy. Roam Ha Noi.',
                tabs: ['Welcome', 'Check-in & Access', 'House Rules', 'My Room', 'Safety and Emergency', 'Check-out', 'Explore Ha Noi']
            },
            vi: {
                title: 'Hướng dẫn lưu trú',
                footer: 'An tâm nghỉ ngơi. Khám phá Hà Nội.',
                tabs: ['Chào mừng', 'Nhận phòng & Mở cửa', 'Nội quy lưu trú', 'Thông tin phòng', 'An toàn & Khẩn cấp', 'Trả phòng', 'Khám phá Hà Nội']
            }
        };

        const guideImages = Array.from(document.querySelectorAll('.tab-content img'));

        function setLanguage(language) {
            if (!Object.prototype.hasOwnProperty.call(translations, language)) return;
            const translation = translations[language];
            document.documentElement.lang = language;
            document.title = translation.title;
            document.getElementById('guide-title').textContent = translation.title;
            document.getElementById('guide-footer').textContent = translation.footer;
            document.querySelectorAll('.tab-btn').forEach((button, index) => {
                button.textContent = translation.tabs[index];
                guideImages[index].alt = translation.tabs[index];
            });
            guideImages.forEach(image => {
                // Fall back to the English image if the selected image cannot load.
                image.onerror = () => {
                    image.onerror = null;
                    image.src = image.dataset.srcEn;
                };
                image.src = language === 'vi' ? image.dataset.srcVi : image.dataset.srcEn;
            });
            document.querySelectorAll('.language-btn').forEach(button => {
                const selected = button.dataset.language === language;
                button.setAttribute('aria-pressed', String(selected));
                button.classList.toggle('bg-emerald-600', selected);
                button.classList.toggle('text-white', selected);
                button.classList.toggle('text-slate-400', !selected);
            });
        }

        setLanguage('en');
    </script>
</body>
</html>
